<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Ping-Pong Epistle - Flat Generative Art</title>
    <!-- Tailwind CSS 用于现代化控制面板和响应式布局 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide 极简图标库 -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", "Source Han Sans CN", "Microsoft YaHei", sans-serif;
            overflow: hidden;
            margin: 0;
            user-select: none;
            -webkit-user-select: none;
            background-color: #0b0f19;
        }

        /* 磨砂玻璃效果配置 */
        .glass-ui {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
        }

        .panel-transition {
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* 文本域优雅的滚动条 */
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 2px;
        }
    </style>
</head>
<body class="w-screen h-screen flex items-center justify-center relative">

    <!-- 用于高清 Retina 显示的矢量画布 -->
    <div class="absolute inset-0 z-0 flex items-center justify-center overflow-hidden">
        <canvas id="artCanvas" class="w-full h-full block"></canvas>
    </div>

    <!-- 极简控制面板切换按钮 -->
    <button id="togglePanelBtn" class="absolute top-6 right-6 z-20 w-10 h-10 rounded-full flex items-center justify-center glass-ui hover:bg-white/10 active:scale-95 transition-all text-white/80 hover:text-white" title="显示/隐藏控制面板">
        <i data-lucide="sliders" class="w-5 h-5"></i>
    </button>

    <!-- 磨砂控制面板 -->
    <div id="controlPanel" class="absolute top-20 right-6 z-20 w-80 glass-ui rounded-2xl p-5 panel-transition opacity-100 translate-y-0 flex flex-col gap-4 max-h-[85vh] overflow-y-auto custom-scrollbar text-slate-200">
        <div class="flex justify-between items-center border-b border-white/10 pb-2">
            <h3 class="text-xs font-bold tracking-wider uppercase text-white/90">艺术设置 / SETTINGS</h3>
            <span class="text-[9px] bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded-full font-mono">VECTOR</span>
        </div>

        <div class="space-y-4 text-xs">
            <!-- 乒乓球桌宽度控制 -->
            <div class="flex flex-col gap-1">
                <div class="flex justify-between text-white/60">
                    <span>乒乓球桌宽度</span>
                    <span id="tableWidthVal" class="font-mono text-emerald-400">350px</span>
                </div>
                <input type="range" id="tableWidth" min="250" max="650" step="5" value="350" class="w-full h-1 bg-white/20 rounded-lg appearance-none cursor-pointer accent-emerald-400">
            </div>

            <!-- 背景色 -->
            <div class="flex flex-col gap-1.5">
                <span class="text-white/60">背景颜色</span>
                <div class="flex gap-2">
                    <button class="bg-picker w-6 h-6 rounded-full border border-white/10 transition-transform hover:scale-110" data-color="#0b0f19" style="background-color: #0b0f19;"></button>
                    <button class="bg-picker w-6 h-6 rounded-full border border-white/10 transition-transform hover:scale-110" data-color="#180f2b" style="background-color: #180f2b;"></button>
                    <button class="bg-picker w-6 h-6 rounded-full border border-white/10 transition-transform hover:scale-110" data-color="#06121e" style="background-color: #06121e;"></button>
                    <input type="color" id="bgColorPicker" value="#0b0f19" class="w-6 h-6 p-0 bg-transparent border-0 cursor-pointer rounded overflow-hidden">
                </div>
            </div>

            <!-- 球桌颜色 -->
            <div class="flex flex-col gap-1.5">
                <span class="text-white/60">球桌颜色</span>
                <div class="flex gap-2">
                    <button class="table-picker w-6 h-6 rounded-full border border-white/10 transition-transform hover:scale-110" data-color="#0e5a8a" style="background-color: #0e5a8a;"></button>
                    <button class="table-picker w-6 h-6 rounded-full border border-white/10 transition-transform hover:scale-110" data-color="#134e5e" style="background-color: #134e5e;"></button>
                    <button class="table-picker w-6 h-6 rounded-full border border-white/10 transition-transform hover:scale-110" data-color="#581c87" style="background-color: #581c87;"></button>
                    <input type="color" id="tableColorPicker" value="#0e5a8a" class="w-6 h-6 p-0 bg-transparent border-0 cursor-pointer rounded overflow-hidden">
                </div>
            </div>

            <!-- 文字颜色配置 -->
            <div class="flex flex-col gap-1.5">
                <span class="text-white/60">文字颜色设置</span>
                <div class="flex gap-4 items-center">
                    <div class="flex items-center gap-1">
                        <input type="color" id="charColorPicker" value="#ffffff" class="w-6 h-6 p-0 bg-transparent border-0 cursor-pointer rounded overflow-hidden">
                        <span class="text-[10px] text-white/50">普通状态</span>
                    </div>
                    <div class="flex items-center gap-1">
                        <input type="color" id="charActiveColorPicker" value="#fde047" class="w-6 h-6 p-0 bg-transparent border-0 cursor-pointer rounded overflow-hidden">
                        <span class="text-[10px] text-white/50">飞舞状态</span>
                    </div>
                </div>
            </div>

            <!-- 乒乓球速度控制 -->
            <div class="flex flex-col gap-1">
                <div class="flex justify-between text-white/60">
                    <span>乒乓球速度</span>
                    <span id="speedVal" class="font-mono text-emerald-400">12.0</span>
                </div>
                <input type="range" id="ballSpeed" min="6" max="25" step="0.5" value="12" class="w-full h-1 bg-white/20 rounded-lg appearance-none cursor-pointer accent-emerald-400">
            </div>

            <!-- 乒乓球大小控制 -->
            <div class="flex flex-col gap-1">
                <div class="flex justify-between text-white/60">
                    <span>乒乓球大小</span>
                    <span id="radiusVal" class="font-mono text-emerald-400">8.0px</span>
                </div>
                <input type="range" id="ballRadius" min="4" max="24" step="0.5" value="8" class="w-full h-1 bg-white/20 rounded-lg appearance-none cursor-pointer accent-emerald-400">
            </div>

            <!-- 纸飞机速度调节 -->
            <div class="flex flex-col gap-1 pt-1.5 border-t border-white/5">
                <div class="flex justify-between text-white/60">
                    <span>纸飞机飞行速度</span>
                    <span id="planeSpeedVal" class="font-mono text-emerald-400">1.0</span>
                </div>
                <input type="range" id="planeSpeed" min="0.3" max="2.5" step="0.1" value="1.0" class="w-full h-1 bg-white/20 rounded-lg appearance-none cursor-pointer accent-emerald-400">
            </div>

            <!-- 纸飞机大小差异调节 -->
            <div class="flex flex-col gap-1">
                <div class="flex justify-between text-white/60">
                    <span>纸飞机大小差异</span>
                    <span id="planeVarianceVal" class="font-mono text-emerald-400">0.30</span>
                </div>
                <input type="range" id="planeVariance" min="0.0" max="0.8" step="0.05" value="0.30" class="w-full h-1 bg-white/20 rounded-lg appearance-none cursor-pointer accent-emerald-400">
            </div>

            <!-- 自定义纸飞机资源上传 -->
            <div class="flex flex-col gap-1.5 pt-2 border-t border-white/10">
                <span class="text-white/60">自定义纸飞机图片 (PNG/JPG)</span>
                <div class="flex items-center gap-2">
                    <label for="planeImageUpload" class="flex-1 py-1.5 px-3 bg-white/10 hover:bg-white/15 text-center text-white/90 rounded-lg cursor-pointer transition-all active:scale-[0.98] border border-white/10 text-[10px] font-semibold">
                        选择本地图片
                    </label>
                    <input type="file" id="planeImageUpload" accept="image/*" class="hidden">
                    <button id="clearPlaneImageBtn" class="px-3 py-1.5 bg-rose-500/20 hover:bg-rose-500/30 text-rose-300 rounded-lg text-[10px] hidden" title="重置纸飞机素材">
                        重置素材
                    </button>
                </div>
                <div id="uploadPreviewContainer" class="flex items-center gap-2 mt-1.5 hidden bg-white/5 p-1.5 rounded-lg border border-white/5">
                    <img id="uploadPreview" class="w-8 h-8 rounded border border-white/10 object-contain bg-white/10">
                    <span id="uploadFileName" class="text-[9px] text-white/50 truncate max-w-[180px]">file.png</span>
                </div>
            </div>

            <!-- 信件可编辑文本域 -->
            <div class="flex flex-col gap-1">
                <span class="text-white/60">上半桌信件文字 (Top Paragraph)</span>
                <textarea id="textTopInput" rows="4" class="w-full bg-white/5 border border-white/10 rounded-lg p-2 text-white/90 text-[10px] focus:outline-none focus:border-emerald-400 custom-scrollbar resize-none leading-relaxed"></textarea>
            </div>

            <div class="flex flex-col gap-1">
                <span class="text-white/60">下半桌信件文字 (Bottom Paragraph)</span>
                <textarea id="textBottomInput" rows="4" class="w-full bg-white/5 border border-white/10 rounded-lg p-2 text-white/90 text-[10px] focus:outline-none focus:border-emerald-400 custom-scrollbar resize-none leading-relaxed"></textarea>
            </div>

            <!-- 应用修改 -->
            <button id="applyTextBtn" class="w-full py-2 bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-300 font-semibold rounded-lg transition-all active:scale-[0.98]">
                应用并重置 (Apply Changes)
            </button>
        </div>
    </div>

    <script>
        // 初始化图标
        lucide.createIcons();

        // 应用运行状态
        const state = {
            bgColor: '#0b0f19',
            tableColor: '#0e5a8a',
            charColor: '#ffffff',
            charActiveColor: '#fde047',
            ballSpeed: 12,
            tableWidth: 350,
            ballRadius: 8,
            planeSpeedFactor: 1.0, 
            planeSizeVariance: 0.3, 
            panelVisible: true,
            customPlaneImage: null,
            // 写给莎莎的手写精细纤细信
            textTop: "亲爱的莎莎姐姐：\n每当在电视机前看到你握紧球拍、眼神专注的样子，我都会忍不住为你欢呼。你的正手拉球像闪电一样快，每一次绝境中微笑着挥拍，都深深鼓舞着我。你是我心中最闪亮的超级英雄。",
            textBottom: "在平时的训练里，每当我觉得累了、想要放弃的时候，爸爸就会告诉我要学习你的坚韧与勇敢。我会一直努力练习，带着对乒乓球的热爱坚持下去。希望有一天，我也能像你一样为国争光。祝你每天都开开心心！\n—— 崇拜你的小球手"
        };

        // 默认输入域赋值
        document.getElementById('textTopInput').value = state.textTop;
        document.getElementById('textBottomInput').value = state.textBottom;

        const canvas = document.getElementById('artCanvas');
        const ctx = canvas.getContext('2d');
        const togglePanelBtn = document.getElementById('togglePanelBtn');
        const controlPanel = document.getElementById('controlPanel');
        const bgColorPicker = document.getElementById('bgColorPicker');
        const tableColorPicker = document.getElementById('tableColorPicker');
        const charColorPicker = document.getElementById('charColorPicker');
        const charActiveColorPicker = document.getElementById('charActiveColorPicker');
        const ballSpeedSlider = document.getElementById('ballSpeed');
        const speedValSpan = document.getElementById('speedVal');
        const ballRadiusSlider = document.getElementById('ballRadius');
        const radiusValSpan = document.getElementById('radiusVal');
        const planeSpeedSlider = document.getElementById('planeSpeed');
        const planeSpeedValSpan = document.getElementById('planeSpeedVal');
        const planeVarianceSlider = document.getElementById('planeVariance');
        const planeVarianceValSpan = document.getElementById('planeVarianceVal');
        const tableWidthSlider = document.getElementById('tableWidth');
        const tableWidthValSpan = document.getElementById('tableWidthVal');
        const applyTextBtn = document.getElementById('applyTextBtn');

        const planeImageUpload = document.getElementById('planeImageUpload');
        const clearPlaneImageBtn = document.getElementById('clearPlaneImageBtn');
        const uploadPreviewContainer = document.getElementById('uploadPreviewContainer');
        const uploadPreview = document.getElementById('uploadPreview');
        const uploadFileName = document.getElementById('uploadFileName');

        // 平面几何桌板配置
        let tableGeo = {
            width: 0,
            height: 0,
            x: 0,
            y: 0,
            ratio: 1.8 
        };

        // ========================================================
        // 性能提升：离线 Canvas 预渲染技术（纸飞机缓存精灵）
        // ========================================================
        let planeCacheCanvas = null;
        let planeCacheCtx = null;
        const PLANE_CACHE_SIZE = 64; 

        function updatePlaneCache() {
            if (!planeCacheCanvas) {
                planeCacheCanvas = document.createElement('canvas');
                planeCacheCtx = planeCacheCanvas.getContext('2d');
            }
            planeCacheCanvas.width = PLANE_CACHE_SIZE;
            planeCacheCanvas.height = PLANE_CACHE_SIZE;
            
            const pCtx = planeCacheCtx;
            pCtx.clearRect(0, 0, PLANE_CACHE_SIZE, PLANE_CACHE_SIZE);
            
            pCtx.save();
            pCtx.translate(PLANE_CACHE_SIZE / 2, PLANE_CACHE_SIZE / 2);
            
            const s = PLANE_CACHE_SIZE * 0.4;
            pCtx.beginPath();
            pCtx.moveTo(s * 0.5, 0);
            pCtx.lineTo(-s * 0.4, -s * 0.3);
            pCtx.lineTo(-s * 0.1, 0);
            pCtx.lineTo(-s * 0.4, s * 0.3);
            pCtx.closePath();
            pCtx.fillStyle = state.charActiveColor;
            pCtx.fill();

            // 精美的折纸中轴脊线
            pCtx.beginPath();
            pCtx.moveTo(s * 0.5, 0);
            pCtx.lineTo(-s * 0.1, 0);
            pCtx.strokeStyle = 'rgba(0,0,0,0.18)';
            pCtx.lineWidth = 1.2;
            pCtx.stroke();
            
            pCtx.restore();
        }

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            
            // 双倍高分屏抗锯齿锐化
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            
            ctx.resetTransform();
            ctx.scale(dpr, dpr);
            
            calculateTableDimensions(rect.width, rect.height);
            initLetterText();
            updatePlaneCache();
        }

        function calculateTableDimensions(winWidth, winHeight) {
            let w = Math.min(state.tableWidth, winWidth - 40);
            let h = w * tableGeo.ratio;

            if (h > winHeight - 60) {
                h = winHeight - 60;
                w = h / tableGeo.ratio;
            }

            tableGeo.width = w;
            tableGeo.height = h;
            tableGeo.x = (winWidth - w) / 2;
            tableGeo.y = (winHeight - h) / 2;
        }

        window.addEventListener('resize', resizeCanvas);

        // ========================================================
        // 字符网格排版系统
        // ========================================================
        let characters = []; 

        function initLetterText() {
            characters = [];
            const margin = tableGeo.width * 0.08; 
            const drawWidth = tableGeo.width - margin * 2;
            
            const fontSize = Math.max(10, Math.min(tableGeo.width / 22, 14));
            
            ctx.font = `normal 200 ${fontSize}px system-ui, -apple-system, "Segoe UI", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif`;
            const lineHeight = fontSize * 1.5;

            // 绘制上半文本 (0.05 至 0.43 比例区间)
            layoutUniversalParagraph(state.textTop, tableGeo.y + tableGeo.height * 0.05, tableGeo.y + tableGeo.height * 0.43, fontSize, lineHeight, margin, drawWidth);

            // 绘制下半文本 (0.57 至 0.95 比例区间)
            layoutUniversalParagraph(state.textBottom, tableGeo.y + tableGeo.height * 0.57, tableGeo.y + tableGeo.height * 0.95, fontSize, lineHeight, margin, drawWidth);
        }

        function layoutUniversalParagraph(textStr, topLimit, bottomLimit, fontSize, lineHeight, margin, drawWidth) {
            const paragraphs = textStr.split('\n');
            let currentY = topLimit;

            paragraphs.forEach(para => {
                if (currentY + lineHeight > bottomLimit) return;
                if (para.trim() === "") {
                    currentY += lineHeight * 0.5;
                    return;
                }

                // 拆分出中文字符、英文字词及标点
                const tokens = [];
                const regex = /[\u4e00-\u9fa5]|[a-zA-Z0-9']+|[^\s\w\u4e00-\u9fa5]|\s+/g;
                let match;
                while ((match = regex.exec(para)) !== null) {
                    tokens.push(match[0]);
                }

                let lines = [];
                let currentLineTokens = [];
                let currentLineWidth = 0;

                tokens.forEach(token => {
                    if (currentLineTokens.length === 0 && token.trim() === '') return;

                    const tokenWidth = ctx.measureText(token).width;
                    if (currentLineWidth + tokenWidth > drawWidth && currentLineTokens.length > 0) {
                        lines.push({ tokens: currentLineTokens, isLast: false });
                        currentLineTokens = [token];
                        currentLineWidth = tokenWidth;
                    } else {
                        currentLineTokens.push(token);
                        currentLineWidth += tokenWidth;
                    }
                });
                if (currentLineTokens.length > 0) {
                    lines.push({ tokens: currentLineTokens, isLast: true });
                }

                lines.forEach(lineObj => {
                    if (currentY + fontSize > bottomLimit) return;

                    const lineTokens = lineObj.tokens;
                    const isLast = lineObj.isLast;
                    const startX = tableGeo.x + margin;

                    const visibleTokens = lineTokens.filter(t => t.trim() !== '');
                    if (visibleTokens.length === 0) return;

                    let totalWordsWidth = 0;
                    visibleTokens.forEach(token => {
                        totalWordsWidth += ctx.measureText(token).width;
                    });
                    const extraSpace = drawWidth - totalWordsWidth;

                    if (isLast || visibleTokens.length === 1) {
                        let currentX = startX;
                        visibleTokens.forEach(token => {
                            for (let i = 0; i < token.length; i++) {
                                const char = token[i];
                                const charW = ctx.measureText(char).width;
                                characters.push(createCharacterObject(char, currentX + charW / 2, currentY + fontSize / 2, fontSize));
                                currentX += charW;
                            }
                            currentX += ctx.measureText(' ').width * 0.5;
                        });
                    } else {
                        const spaceBetweenTokens = extraSpace / (visibleTokens.length - 1);
                        let currentX = startX;

                        visibleTokens.forEach((token, tokenIdx) => {
                            for (let i = 0; i < token.length; i++) {
                                const char = token[i];
                                const charW = ctx.measureText(char).width;
                                characters.push(createCharacterObject(char, currentX + charW / 2, currentY + fontSize / 2, fontSize));
                                currentX += charW;
                            }
                            if (tokenIdx < visibleTokens.length - 1) {
                                currentX += spaceBetweenTokens;
                            }
                        });
                    }
                    currentY += lineHeight;
                });
                currentY += lineHeight * 0.3; 
            });
        }

        function createCharacterObject(char, x, y, size) {
            return {
                char: char,
                origX: x,
                origY: y,
                x: x,
                y: y,
                fontSize: size,
                
                state: 'STATIC', // 'STATIC' | 'SCATTERED' | 'RETURNING'
                isPlaneType: false, 
                morphProgress: 0, 
                vx: 0,
                vy: 0,
                angle: 0,
                angularVelocity: 0,
                scatterTimer: 0,
                returnProgress: 0,
                randomWindOffset: Math.random() * 100,

                planeScaleMult: 1.0,  
                planeAlphaMult: 1.0,  

                curveDriftFactor: (Math.random() - 0.5) * 0.08, 
                glideDestination: { x: 0, y: 0 },              
                
                // 局部受击物理及延迟蓄力参数
                hitProgress: 0,  
                hitAngle: 0,
                offsetX: 0,
                offsetY: 0,
                hitScale: 1
            };
        }

        // ========================================================
        // 乒乓球物理引擎
        // ========================================================
        let ball = {
            x: 0,
            y: 0,
            vx: 0,
            vy: 0,
            z: 0,           
            radius: 8,
            scale: 1,       
            
            state: 'GOING_UP',
            bounceY: 0,     
            hasBouncedThisPass: false
        };

        function resetBall() {
            ball.radius = state.ballRadius;
            ball.x = tableGeo.x + tableGeo.width / 2;
            ball.y = window.innerHeight + 150;
            ball.vy = -state.ballSpeed;
            
            ball.vx = (Math.random() - 0.5) * 4;
            ball.state = 'GOING_UP';
            ball.hasBouncedThisPass = false;
            
            ball.bounceY = tableGeo.y + tableGeo.height * 0.15 + Math.random() * (tableGeo.height * 0.25);
            ball.z = 15;
        }

        function updateBallPhysics() {
            ball.x += ball.vx;
            ball.y += ball.vy;

            if (ball.state === 'GOING_UP') {
                const triggerOffscreenTop = -150; 
                const startY = window.innerHeight + 150; 
                const targetY = ball.bounceY;

                if (!ball.hasBouncedThisPass) {
                    const progress = Math.max(0, Math.min(1, (ball.y - startY) / (targetY - startY)));
                    const heightFactor = Math.max(0, -4 * Math.pow(progress - 0.5, 2) + 1);
                    ball.z = heightFactor * 30; 
                } else {
                    const progress = Math.max(0, Math.min(1, (ball.y - targetY) / (triggerOffscreenTop - targetY)));
                    const heightFactor = Math.max(0, -4 * Math.pow(progress - 0.5, 2) + 1);
                    ball.z = heightFactor * 30;
                }

                if (!ball.hasBouncedThisPass && ball.y <= ball.bounceY) {
                    ball.z = 0;
                    ball.hasBouncedThisPass = true;
                    triggerDandelionImpact(ball.x, ball.y);
                }

                if (ball.y < triggerOffscreenTop) {
                    ball.y = triggerOffscreenTop;
                    ball.vy = state.ballSpeed;
                    
                    const centerOffset = (tableGeo.x + tableGeo.width / 2) - ball.x;
                    ball.vx = centerOffset * 0.008 + (Math.random() - 0.5) * 3;
                    
                    ball.state = 'GOING_DOWN';
                    ball.hasBouncedThisPass = false;
                    ball.bounceY = tableGeo.y + tableGeo.height * 0.6 + Math.random() * (tableGeo.height * 0.25);
                }
            } 
            else if (ball.state === 'GOING_DOWN') {
                const triggerOffscreenBottom = window.innerHeight + 150; 
                const startY = -150; 
                const targetY = ball.bounceY;

                if (!ball.hasBouncedThisPass) {
                    const progress = Math.max(0, Math.min(1, (ball.y - startY) / (targetY - startY)));
                    const heightFactor = Math.max(0, -4 * Math.pow(progress - 0.5, 2) + 1);
                    ball.z = heightFactor * 30;
                } else {
                    const progress = Math.max(0, Math.min(1, (ball.y - targetY) / (triggerOffscreenBottom - targetY)));
                    const heightFactor = Math.max(0, -4 * Math.pow(progress - 0.5, 2) + 1);
                    ball.z = heightFactor * 30;
                }

                if (!ball.hasBouncedThisPass && ball.y >= ball.bounceY) {
                    ball.z = 0;
                    ball.hasBouncedThisPass = true;
                    triggerDandelionImpact(ball.x, ball.y);
                }

                if (ball.y > triggerOffscreenBottom) {
                    ball.y = triggerOffscreenBottom;
                    ball.vy = -state.ballSpeed;
                    
                    const centerOffset = (tableGeo.x + tableGeo.width / 2) - ball.x;
                    ball.vx = centerOffset * 0.008 + (Math.random() - 0.5) * 3;
                    
                    ball.state = 'GOING_UP';
                    ball.hasBouncedThisPass = false;
                    ball.bounceY = tableGeo.y + tableGeo.height * 0.15 + Math.random() * (tableGeo.height * 0.25);
                }
            }

            ball.scale = 1.0 + (ball.z / 45);
        }

        // ========================================================
        // 🌟 核心调优：小球撞击瞬间零延迟蒲公英激落爆散系统 🌟
        // ========================================================
        function triggerDandelionImpact(bx, by) {
            // 🎯 极致收缩受击圆形范围至最舒适比例 (宽度 11%)，使整体画面干净而不凌乱
            const impactRadius = tableGeo.width * 0.11; 

            characters.forEach(char => {
                const dx = char.origX - bx;
                const dy = char.origY - by;
                const dist = Math.sqrt(dx * dx + dy * dy);

                // 只波及静态或者正准备归巢的文字，在物理触地的一刹那立刻激落
                if (dist < impactRadius && (char.state === 'STATIC' || char.state === 'RETURNING')) {
                    char.state = 'SCATTERED';
                    char.isPlaneType = false; // 白球击中触发纯文字唯美喷落，不变成纸飞机

                    // 1. 瞬间点亮活跃颜色，并放大 1.25x (提供清脆的瞬间打击爽快感)
                    char.hitProgress = 1.0; 
                    char.hitScale = 1.25; 

                    // 2. 完美的 360° 放射状爆散方向，从击中爆心处依次射出
                    const angle = Math.atan2(dy, dx) + (Math.random() - 0.5) * 0.25;
                    char.hitAngle = angle;

                    // 3. 极速响应飞逸力道，保证清脆的瞬时物理弹出反馈，越靠近落点初速越强
                    const intensity = 1.0 - (dist / impactRadius);
                    const power = intensity * 4.8 + 1.6; // 强烈且清脆的爆发速度

                    char.vx = Math.cos(angle) * power;
                    char.vy = Math.sin(angle) * power - 0.6; // 附加微弱向上的空气浮力
                    char.angularVelocity = (Math.random() - 0.5) * 0.15; // 狂乱翻转角
                    char.scatterTimer = 110 + Math.random() * 50; // 空中优雅旋停周期
                }
            });
        }

        // ========================================================
        // 字符与纸飞机物理姿态更新（Craig Reynolds 转向行为 + 跨网航线 & 弧线模拟）
        // ========================================================
        function updateCharacters(time) {
            characters.forEach(char => {
                // 1. 局部高频颤动与膨胀快速衰减复位
                if (char.hitProgress > 0) {
                    char.hitProgress -= 0.038; 
                    if (char.hitProgress < 0) char.hitProgress = 0;
                    char.hitScale = 1.0 + 0.3 * char.hitProgress; 
                } else {
                    char.hitScale = 1.0;
                }

                // 2. 主状态机
                if (char.state === 'STATIC') {
                    char.x = char.origX;
                    char.y = char.origY;
                    char.angle = 0;
                    char.morphProgress = 0;
                    char.isPlaneType = false;
                } 
                else if (char.state === 'SCATTERED') {
                    if (char.isPlaneType) {
                        if (char.morphProgress < 1) {
                            char.morphProgress += 0.04;
                            if (char.morphProgress > 1) char.morphProgress = 1;
                        }
                    } else {
                        char.morphProgress = 0; 
                    }

                    const speed = Math.sqrt(char.vx * char.vx + char.vy * char.vy);
                    
                    if (char.isPlaneType) {
                        // 纸飞机空气侧偏力矩（模拟弧线滑翔轨迹）
                        const curveForceX = -char.vy * char.curveDriftFactor * state.planeSpeedFactor;
                        const curveForceY = char.vx * char.curveDriftFactor * state.planeSpeedFactor;
                        char.vx += curveForceX;
                        char.vy += curveForceY;

                        // 向目的地牵引
                        const targetDx = char.glideDestination.x - char.x;
                        const targetDy = char.glideDestination.y - char.y;
                        const targetDist = Math.sqrt(targetDx * targetDx + targetDy * targetDy) || 1;
                        
                        if (targetDist > 15) {
                            char.vx += (targetDx / targetDist) * 0.08 * state.planeSpeedFactor;
                            char.vy += (targetDy / targetDist) * 0.08 * state.planeSpeedFactor;
                        }

                        // 机头角丝滑指向当前速度矢量 (绝不原地打转)
                        if (speed > 0.4) {
                            const targetAngle = Math.atan2(char.vy, char.vx);
                            let angleDiff = targetAngle - char.angle;
                            angleDiff = Math.atan2(Math.sin(angleDiff), Math.cos(angleDiff)); 
                            char.angle += angleDiff * 0.12;
                        } else {
                            let angleDiff = 0 - char.angle;
                            angleDiff = Math.atan2(Math.sin(angleDiff), Math.cos(angleDiff));
                            char.angle += angleDiff * 0.04;
                        }

                        // 空中滑行微弱升力
                        const lift = speed * 0.06;
                        char.vy -= lift * 0.12; 
                    } else {
                        // 蒲公英散射普通字体的轻柔滚动旋转
                        char.angle += char.angularVelocity;
                    }

                    // 微弱环境风阻扰动
                    const wave = Math.sin(time * 0.03 + char.randomWindOffset) * 0.12;
                    char.vx += -Math.sin(char.angle) * wave;
                    char.vy += Math.cos(char.angle) * wave;

                    // 白球散落字符有较强空气摩擦，使其在空中徐徐漂流减速；纸飞机摩擦阻力极低，能飞得更遥远
                    const friction = char.isPlaneType ? 0.988 : 0.955;
                    char.vx *= friction;
                    char.vy *= friction;

                    char.x += char.vx;
                    char.y += char.vy;

                    char.scatterTimer--;
                    if (char.scatterTimer <= 0) {
                        char.state = 'RETURNING';
                        char.returnProgress = 0;
                    }
                } 
                else if (char.state === 'RETURNING') {
                    if (char.morphProgress > 0) {
                        char.morphProgress -= 0.025;
                        if (char.morphProgress < 0) char.morphProgress = 0;
                    }

                    const dx = char.origX - char.x;
                    const dy = char.origY - char.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 15) {
                        // 软着陆对齐
                        const easeFactor = 0.07;
                        char.x += dx * easeFactor;
                        char.y += dy * easeFactor;
                        char.vx *= 0.8;
                        char.vy *= 0.8;

                        let angleDiff = 0 - char.angle;
                        angleDiff = Math.atan2(Math.sin(angleDiff), Math.cos(angleDiff));
                        char.angle += angleDiff * 0.1;

                        if (dist < 0.5) {
                            char.x = char.origX;
                            char.y = char.origY;
                            char.angle = 0;
                            char.state = 'STATIC';
                            char.morphProgress = 0;
                            char.isPlaneType = false;
                        }
                    } else {
                        // 转向力学 (Steering Behavior)：顺滑画弧弯道前行，不生硬直接回拉
                        const cruiseSpeed = (char.isPlaneType ? 4.2 : 2.8) * state.planeSpeedFactor; 
                        const desiredVx = (dx / dist) * cruiseSpeed;
                        const desiredVy = (dy / dist) * cruiseSpeed;

                        const steerStrength = char.isPlaneType ? 0.038 : 0.055; 
                        char.vx += (desiredVx - char.vx) * steerStrength;
                        char.vy += (desiredVy - char.vy) * steerStrength;

                        char.x += char.vx;
                        char.y += char.vy;

                        const speed = Math.sqrt(char.vx * char.vx + char.vy * char.vy);
                        if (speed > 0.1) {
                            const targetAngle = Math.atan2(char.vy, char.vx);
                            let angleDiff = targetAngle - char.angle;
                            angleDiff = Math.atan2(Math.sin(angleDiff), Math.cos(angleDiff));
                            char.angle += angleDiff * 0.1; 
                        }
                    }
                }
            });
        }

        // ========================================================
        // 极速双渲染通道 (批量渲染提升 + 缓存绘制)
        // ========================================================
        function draw(time) {
            // 背景
            ctx.fillStyle = state.bgColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 球桌
            ctx.fillStyle = state.tableColor;
            ctx.fillRect(tableGeo.x, tableGeo.y, tableGeo.width, tableGeo.height);

            // 加粗纯白色球桌边线
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 6;
            ctx.strokeRect(tableGeo.x, tableGeo.y, tableGeo.width, tableGeo.height);

            // 拟真长网线
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            const netExtension = tableGeo.width * 0.04; 
            ctx.moveTo(tableGeo.x - netExtension, tableGeo.y + tableGeo.height / 2);
            ctx.lineTo(tableGeo.x + tableGeo.width + netExtension, tableGeo.y + tableGeo.height / 2);
            ctx.stroke();

            // 绘制字符与纸飞机
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            characters.forEach(char => {
                const textOpacity = 1 - char.morphProgress;
                const planeOpacity = char.morphProgress;

                // 🌟 核心极速通道：跳过普通状态矩阵变换
                if (char.state === 'STATIC' && char.hitScale === 1) {
                    ctx.fillStyle = state.charColor;
                    ctx.font = `normal 200 ${char.fontSize}px system-ui, -apple-system, sans-serif`;
                    ctx.fillText(char.char, char.origX, char.origY);
                    return;
                }

                // 运动活动节点混合绘制
                ctx.save();
                ctx.translate(char.x, char.y);
                ctx.rotate(char.angle);

                if (char.hitScale !== 1) {
                    ctx.scale(char.hitScale, char.hitScale);
                }

                // 1. 文本形态渲染
                if (textOpacity > 0.01) {
                    ctx.save();
                    ctx.globalAlpha = textOpacity;
                    if (char.state !== 'STATIC' || char.hitProgress > 0) {
                        ctx.fillStyle = state.charActiveColor;
                    } else {
                        ctx.fillStyle = state.charColor;
                    }
                    ctx.font = `normal 200 ${char.fontSize}px system-ui, -apple-system, sans-serif`;
                    ctx.fillText(char.char, 0, 0);
                    ctx.restore();
                }

                // 2. 纸飞机形态渲染 (离线缓存贴图)
                if (planeOpacity > 0.01) {
                    ctx.save();
                    ctx.globalAlpha = planeOpacity * char.planeAlphaMult;
                    
                    const planeSize = char.fontSize * 1.6 * char.planeScaleMult;

                    if (state.customPlaneImage) {
                        ctx.drawImage(
                            state.customPlaneImage,
                            -planeSize / 2,
                            -planeSize / 2,
                            planeSize,
                            planeSize
                        );
                    } else {
                        ctx.drawImage(
                            planeCacheCanvas,
                            0, 0, PLANE_CACHE_SIZE, PLANE_CACHE_SIZE,
                            -planeSize / 2, -planeSize / 2, planeSize, planeSize
                        );
                    }
                    ctx.restore();
                }

                ctx.restore();
            });

            // 绘制小球纯扁平阴影
            const shadowX = ball.x + 5;
            const shadowY = ball.y + 12; 
            
            ctx.fillStyle = 'rgba(0, 0, 0, 0.25)'; 
            ctx.beginPath();
            ctx.arc(shadowX, shadowY, ball.radius, 0, Math.PI * 2);
            ctx.fill();

            // 绘制白色小球本体
            const drawnRadius = ball.radius * ball.scale;
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(ball.x, ball.y - ball.z, drawnRadius, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 1.2;
            ctx.stroke();
        }

        // ========================================================
        // 游戏循环与控制器联动
        // ========================================================
        let globalTime = 0;
        function loop() {
            globalTime++;
            updateBallPhysics();
            updateCharacters(globalTime);
            draw(globalTime);
            requestAnimationFrame(loop);
        }

        togglePanelBtn.addEventListener('click', () => {
            state.panelVisible = !state.panelVisible;
            if (state.panelVisible) {
                controlPanel.classList.remove('opacity-0', 'pointer-events-none', '-translate-y-2');
                controlPanel.classList.add('opacity-100', 'translate-y-0');
            } else {
                controlPanel.classList.add('opacity-0', 'pointer-events-none', '-translate-y-2');
                controlPanel.classList.remove('opacity-100', 'translate-y-0');
            }
        });

        function updateBgColor(color) {
            state.bgColor = color;
            bgColorPicker.value = color;
        }
        function updateTableColor(color) {
            state.tableColor = color;
            tableColorPicker.value = color;
        }

        bgColorPicker.addEventListener('input', (e) => updateBgColor(e.target.value));
        tableColorPicker.addEventListener('input', (e) => {
            updateTableColor(e.target.value);
            updatePlaneCache();
        });
        
        charColorPicker.addEventListener('input', (e) => {
            state.charColor = e.target.value;
        });

        charActiveColorPicker.addEventListener('input', (e) => {
            state.charActiveColor = e.target.value;
            updatePlaneCache(); 
        });

        ballSpeedSlider.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            state.ballSpeed = val;
            speedValSpan.textContent = val.toFixed(1);
            if (ball.vy > 0) ball.vy = state.ballSpeed;
            else ball.vy = -state.ballSpeed;
        });

        ballRadiusSlider.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            state.ballRadius = val;
            radiusValSpan.textContent = `${val.toFixed(1)}px`;
            ball.radius = val;
        });

        planeSpeedSlider.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            state.planeSpeedFactor = val;
            planeSpeedValSpan.textContent = val.toFixed(1);
        });

        planeVarianceSlider.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            state.planeSizeVariance = val;
            planeVarianceValSpan.textContent = val.toFixed(2);
        });

        tableWidthSlider.addEventListener('input', (e) => {
            const val = parseInt(e.target.value);
            state.tableWidth = val;
            tableWidthValSpan.textContent = `${val}px`;
            const rect = canvas.getBoundingClientRect();
            calculateTableDimensions(rect.width, rect.height);
            initLetterText();
            resetBall();
        });

        document.querySelectorAll('.bg-picker').forEach(btn => {
            btn.addEventListener('click', () => updateBgColor(btn.dataset.color));
        });
        document.querySelectorAll('.table-picker').forEach(btn => {
            btn.addEventListener('click', () => {
                updateTableColor(btn.dataset.color);
                updatePlaneCache();
            });
        });

        planeImageUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        state.customPlaneImage = img;
                        uploadPreview.src = event.target.result;
                        uploadFileName.textContent = file.name;
                        uploadPreviewContainer.classList.remove('hidden');
                        clearPlaneImageBtn.classList.remove('hidden');
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        clearPlaneImageBtn.addEventListener('click', () => {
            state.customPlaneImage = null;
            planeImageUpload.value = '';
            uploadPreviewContainer.classList.add('hidden');
            clearPlaneImageBtn.classList.add('hidden');
        });

        // 监听画布点击：全场大绽放！约 22% 字符幻化为超长航线、大弧向的折纸飞机越网飞越对侧
        canvas.addEventListener('pointerdown', (e) => {
            if (e.target !== canvas) return;

            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            const tableCenterY = tableGeo.y + tableGeo.height / 2;

            characters.forEach(char => {
                char.state = 'SCATTERED';
                
                char.isPlaneType = Math.random() < 0.22; 
                char.planeScaleMult = 1.0 + (Math.random() - 0.5) * state.planeSizeVariance * 2;
                char.planeAlphaMult = 0.55 + Math.random() * 0.45;

                // 长程对侧目的地
                const isCharOnTop = (char.origY < tableCenterY);
                char.glideDestination = {
                    x: tableGeo.x + Math.random() * tableGeo.width,
                    y: isCharOnTop 
                        ? (tableCenterY + Math.random() * (tableGeo.height * 0.45)) 
                        : (tableGeo.y + Math.random() * (tableGeo.height * 0.45))
                };

                // 全向大爆炸速度
                const dx = char.x - clickX;
                const dy = char.y - clickY;
                const dist = Math.sqrt(dx * dx + dy * dy) || 1;
                
                const angle = Math.atan2(dy, dx) + (Math.random() - 0.5) * 0.2; 
                const maxDist = Math.max(canvas.width, canvas.height);
                const proximityFactor = Math.max(0.15, 1.1 - dist / (maxDist * 0.45));
                
                const basePower = (char.isPlaneType ? 7.5 : 4.5 + Math.random() * 4.5) * state.planeSpeedFactor; 
                const power = basePower * proximityFactor;

                char.vx = Math.cos(angle) * power;
                char.vy = Math.sin(angle) * power - 0.5 * state.planeSpeedFactor; 
                char.angularVelocity = (Math.random() - 0.5) * 0.15; 
                
                char.scatterTimer = char.isPlaneType 
                    ? (260 + Math.random() * 160) 
                    : (120 + Math.random() * 60);  
                
                char.morphProgress = 0; 
                char.angle = angle; 
            });
        });

        applyTextBtn.addEventListener('click', () => {
            state.textTop = document.getElementById('textTopInput').value;
            state.textBottom = document.getElementById('textBottomInput').value;
            initLetterText();
            resetBall();
        });

        window.onload = function() {
            resizeCanvas();
            resetBall();
            loop();
        };
    </script>
</body>
</html>
